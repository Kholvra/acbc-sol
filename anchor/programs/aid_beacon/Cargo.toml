[package]
name = "aid_beacon"
version = "0.1.0"
description = "AidBeacon disaster relief crowdfunding program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aid_beacon"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.0", features = ["metadata"] }
